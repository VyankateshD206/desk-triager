name: desk-triager-demo
services:
  postgres:
    image: postgres:17.6-alpine
    environment:
      POSTGRES_USER: desk
      POSTGRES_PASSWORD: local-demo-password
      POSTGRES_DB: desk
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: [CMD-SHELL, 'pg_isready -U desk -d desk']
      interval: 3s
      timeout: 3s
      retries: 20
  triager:
    build: ..
    environment:
      DATABASE_URL: postgresql://desk:local-demo-password@postgres:5432/desk
      SIMULATOR_ENABLED: 'false'
      AI_PROVIDER: offline
      DESK_TOKEN: local-access-token
      TICK_GAP_SECONDS: '15'
      GRAPH_CHECKPOINT_PATH: /data/graph.sqlite3
      LOKI_URL: http://loki:3100
      PROMETHEUS_URL: http://prometheus:9090
      DEMO_SERVICE_URL: http://demo:8001
    ports:
      - '127.0.0.1:18000:8000'
    volumes:
      - checkpoints:/data
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test: [CMD, python, -c, "import urllib.request; urllib.request.urlopen('http://localhost:8000/health')"]
      interval: 3s
      timeout: 3s
      retries: 30
  demo:
    build: ..
    command: [uvicorn, demo.app:app, --host, 0.0.0.0, --port, '8001', --no-access-log]
    environment:
      TRIAGER_URL: http://triager:8000
      LOKI_URL: http://loki:3100
      DESK_TOKEN: local-access-token
      DEMO_TOKEN: local-demo-token
    ports:
      - '127.0.0.1:18001:8001'
    depends_on:
      triager:
        condition: service_healthy
    healthcheck:
      test: [CMD, python, -c, "import urllib.request; urllib.request.urlopen('http://localhost:8001/health')"]
      interval: 3s
      timeout: 3s
      retries: 30
  prometheus:
    image: prom/prometheus:v3.5.0
    command: [--config.file=/etc/prometheus/prometheus.yml, --storage.tsdb.retention.time=24h]
    volumes:
      - ./prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - prometheus-data:/prometheus
    ports:
      - '127.0.0.1:19090:9090'
  loki:
    image: grafana/loki:3.5.0
    command: [-config.file=/etc/loki/demo.yaml]
    volumes:
      - ./loki.yaml:/etc/loki/demo.yaml:ro
      - loki-data:/loki
    ports:
      - '127.0.0.1:13100:3100'
volumes:
  postgres-data:
  checkpoints:
  prometheus-data:
  loki-data:
