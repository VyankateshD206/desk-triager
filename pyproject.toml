[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "desk-triager"
version = "1.3.0"
readme = "README.md"
description = "Trading service telemetry, anomaly detection and approval-gated incident triage"
requires-python = ">=3.11"
dependencies = ["fastapi>=0.115,<1", "uvicorn[standard]>=0.30,<1", "sqlalchemy>=2.0,<3", "psycopg[binary]>=3.2,<4", "scikit-learn>=1.5,<2", "numpy>=1.26,<3", "httpx>=0.27,<1", "python-dotenv>=1,<2", "langgraph>=1.2.16,<2", "langgraph-checkpoint-sqlite>=3.1.2,<4"]

[project.optional-dependencies]
dev = ["pytest>=8,<9", "httpx>=0.27,<1", "ruff>=0.9,<1", "build>=1.2,<2", "setuptools>=68", "wheel>=0.43"]

[tool.setuptools.packages.find]
include = ["triager*"]

[tool.setuptools.package-data]
triager = ["static/*"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
target-version = "py311"
line-length = 100

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I"]
