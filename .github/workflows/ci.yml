name: Checks
on: [push, pull_request]
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      AI_PROVIDER: offline
      DATABASE_URL: ''
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: pyproject.toml
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: pip install -e '.[dev]'
      - run: npm ci --ignore-scripts
      - run: npm run build
      - run: npm test
      - run: python -m evals.run --output eval-results.json
      - uses: actions/upload-artifact@v4
        with:
          name: offline-evaluation
          path: eval-results.json
  demo:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - name: Start demo stack
        run: docker compose -f infra/compose.yaml up -d --build --wait --wait-timeout 180
      - name: Verify faults and evidence tools
        run: docker compose -f infra/compose.yaml exec -T triager python scripts/verify_demo.py
      - name: Collect demo diagnostics
        if: failure()
        run: docker compose -f infra/compose.yaml logs --no-color --tail 100
      - name: Stop demo stack
        if: always()
        run: docker compose -f infra/compose.yaml down
